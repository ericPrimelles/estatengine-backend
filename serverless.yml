service: dvst-estatengine-backend-${env:STAGE}  # Change to your project/service name

frameworkVersion: '4'

provider:
  name: aws
  runtime: python3.9  # or python3.11, etc.
  region: us-east-2
  stage: ${env:STAGE}
  memorySize: 128
  timeout: 10
  environment:
    STAGE: ${opt:stage, 'dev'}
    APP_NAME: my-service-name
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: "arn:aws:logs"
        
        - Effect: Allow
          Action:
            - bedrock:InvokeAgent
          Resource: '*'
plugins:
  - serverless-appsync-plugin
  #- serverless-python-requirements

# custom:
#   pythonRequirements:
#     dockerizePip: false
#     #pyhtonBin: python3.9
#     zip: true
#     slim: true

package:
  individually: true 
  exclude:
    - ./**
  include:
    - appsync/*
    - src/dist/*
   
functions:
  bedrock:
    name: dvst-estatengine-backend-bedrock-handler-${sls:stage}
    handler: bootstrap
    runtime: provided.al2023
    timeout: 30
    package:
      artifact: src/bedrock_handler/bedrock_handler.zip
    environment:
      AGENT_ID : ${env:AGENT_ID}
      AGENT_ALIAS_ID: ${env:AGENT_ALIAS_ID}
      
    
    

  search_engine:
    name: dvst-estatengine-backend-search-engine-${sls:stage}
    handler: search_engine.handler
    package:
      # include:
      #   - src/search_engine/*
      artifact: src/dist/search_engine.zip
    environment:
      GPSE_API_KEY: ${env:GPSE_API_KEY}
      GOOGLE_API_ID: ${env:GOOGLE_API_ID}

appSync:
  name: dvst-estatengine-backend-graphqlApi-${sls:stage}
  schema:
    - ./appsync/schema.graphql
    - ./appsync/backend_table/schema.graphql
    - ./appsync/search_engine/schema.graphql
    - ./appsync/attom_property_api/schema.graphql
  authentication:
    type: API_KEY
  apiKeys:
    - name: dvst-estatengine-backend-graphqlApi-${sls:stage}-key
      description: API Key for the GraphQL API
      expires: 1Y # 1 year, adjust as needed
  additionalAuthentications:
    - type: AMAZON_COGNITO_USER_POOLS
      config:
        userPoolId: ${env:COGNITO_USER_POOL_ID}
        awsRegion: ${self:provider.region}
        appIdClientRegex: ${env:COGNITO_USER_POOL_CLIENT_ID}
  logging:
    level: ALL
    retentionInDays: 3
  dataSources: 
    - ${file(./appsync/datasources.yml)}
  resolvers:
    - ${file(./appsync/backend_table/pipelines.yml)}
    - ${file(./appsync/search_engine/pipelines.yml)}
    - ${file(./appsync/attom_property_api/pipelines.yml)}
  pipelineFunctions:
    - ${file(./appsync/backend_table/functions.yml)}
    - ${file(./appsync/search_engine/functions.yml)}
    - ${file(./appsync/attom_property_api/functions.yml)}
  environment:
    AT_API_KEY: ${env:ATTOM_APIKEY}
    STAGE: ${sls:stage}
  

resources:
  Resources:
    # Template roles
    AppsyncPermissionsRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: appsync.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: AppsyncLambdaInvocationPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - lambda:InvokeFunction
                  Resource:
                    - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:dvst-estatengine-backend-openai-proxy-${sls:stage}"
                    - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:dvst-estatengine-backend-search-engine-${sls:stage}"
                    
          - PolicyName: AppsyncDynamoDBPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:PutItem
                    - dynamodb:GetItem
                    - dynamodb:Query
                    - dynamodb:Scan
                    - dynamodb:DeleteItem
                  Resource:
                    - Fn::GetAtt:
                      - BackendDdBbTable
                      - Arn
          - PolicyName: AppsyncAttomApiPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - execute-api:Invoke
                  Resource:
                    - !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AttomProxyApi}/*/*/*"         
    
    BackendDdBbTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: dvst-estatengine-backend-${sls:stage}-table
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true

    AttomProxyApi:
      Type: AWS::ApiGateway::RestApi
      Properties:
        Name: dvst-estatengine-backend-attom-proxy-${sls:stage}
        Description: API for Attom Property Data
        FailOnWarnings: true
        EndpointConfiguration:
          Types:
            - REGIONAL
        #Body: ${file(./apigateway/attom_proxy/body.yml)}
    
    AttomProxyPropertyResource:
      Type: AWS::ApiGateway::Resource
      Properties:
        ParentId: !GetAtt AttomProxyApi.RootResourceId
        PathPart: property
        RestApiId: !Ref AttomProxyApi
    
    AttomProxyAddressResource:
      Type: AWS::ApiGateway::Resource
      Properties:
        ParentId: !Ref AttomProxyPropertyResource
        PathPart: address
        RestApiId: !Ref AttomProxyApi
    
    AttomAddressGetMethod:
      Type: AWS::ApiGateway::Method
      Properties:
        HttpMethod: GET
        ResourceId: !Ref AttomProxyAddressResource
        RestApiId: !Ref AttomProxyApi
        AuthorizationType: AWS_IAM
        RequestParameters:
          method.request.querystring.postalcode: true
          method.request.querystring.page: true
          method.request.querystring.pagesize: true
          method.request.header.apikey: true
        Integration:
          Type: HTTP_PROXY
          IntegrationHttpMethod: GET
          Uri: !Sub "https://api.gateway.attomdata.com/propertyapi/v1.0.0/property/address"
          RequestParameters:
            integration.request.header.Accept: "'application/json'"
            integration.request.header.apikey: method.request.header.apikey
          PassthroughBehavior: WHEN_NO_MATCH
        MethodResponses:
          - StatusCode: 200
    
    AttomProxyDeployment:
      Type: AWS::ApiGateway::Deployment
      DependsOn: 
        - AttomProxyApi  # Ensure the API is created first
        - AttomAddressGetMethod  # Ensure the method is created before deployment
      Properties:
        RestApiId: !Ref AttomProxyApi
        StageName: dummy  # Needed but will be overridden; we define a real Stage below

    AttomProxyStage:
      Type: AWS::ApiGateway::Stage
      DependsOn: AttomProxyDeployment
      Properties:
        StageName: !Sub ${sls:stage}
        RestApiId: !Ref AttomProxyApi
        DeploymentId: !Ref AttomProxyDeployment
        
      