service: dvst-estatengine-backend-${env:STAGE}  # Change to your project/service name

frameworkVersion: '4'

provider:
  name: aws
  runtime: python3.9  # or python3.11, etc.
  region: us-east-2
  stage: ${env:STAGE}
  memorySize: 128
  timeout: 10
  environment:
    STAGE: ${opt:stage, 'dev'}
    APP_NAME: my-service-name
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: "arn:aws:logs:*"

functions:
  hello:
    name: dvst-estatengine-backend-openai-proxy-${sls:stage}
    handler: openai_handler.handler
    zipFile: src/openai_handler.zip
    events:
      - http:
          path: openai-proxy
          description: OpenAI Proxy Endpoint
          method: post
          cors: true

