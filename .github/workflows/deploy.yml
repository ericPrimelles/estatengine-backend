name: Deploy drivestae-estatengine-backend SAM App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy SAM App
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v3

    - name: 🧰 Set up AWS credentials
      uses: aws-actions/configure-aws-credentials@v3
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.ESTATENGINE_DEFAULT_REGION }}
        #role-to-assume: ${{ secrets.ROLE_TO_ASSUME }}
        role-session-name: GitHubActionsSession

    - name: 🧱 Install AWS SAM CLI
      uses: aws-actions/setup-sam@v2
      

    - name: 🔧 Install dependencies (if needed)
      run: |
        cd estatengine-backend
        if [ -f package.json ]; then npm install; fi
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 🛠️ Build SAM application
      
      run: |
       cd estatengine-backend
       sam build

    - name: ☁️ Deploy SAM application
      run: |
        cd estatengine-backend
        sam deploy --confirm-changeset --on-failure DELETE