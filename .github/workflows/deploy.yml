name: Deploy drivestate-estatengine-backend

on:
    push:
        branches:
            - main
            - attom_proxy
jobs:
    deploy:
        name: Deploy Backend
        runs-on: ubuntu-latest

        env:
            AWS_REGION: us-east-2
            STAGE: dev
            SERVERLESS_ACCESS_KEY: ${{secrets.SERVERLESS_ACCESS_KEY}}
        
        steps:
            - name: Checkout repo
              uses: actions/checkout@v3

            - name: Set up Python
              uses: actions/setup-python@v3
              with:
                python-version: "3.13"
            - name: Set up NodeJs
              uses: actions/setup-node@v4
             
            
            - name: Install Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                terraform_version: 1.6.6
            
            - name: Configure AWS Credentials for ACCESS account
              uses: aws-actions/configure-aws-credentials@v2
              with:
                aws-access-key-id: ${{ secrets.ACCESS_AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.ACCESS_AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ env.AWS_REGION }}
            
            - name: Cognito Parameters
              run: |
                export COGNITO_USER_POOL_ID=$(aws ssm get-parameter --name /dvst/auth/userpool/$STAGE --query Parameter.Value --output text)
                export COGNITO_USER_POOL_CLIENT_ID=$(aws ssm get-parameter --name /dvst/auth/userpool/client/$STAGE --query Parameter.Value --output text)

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v2
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ env.AWS_REGION }}
            - name: Serverless Deploy
              run: |
                
                # export STAGE=dev
                                
                export GPSE_API_KEY=${{ secrets.GPSE_API_KEY }}
                export GOOGLE_API_ID=${{ secrets.GOOGLE_API_ID }}
                export ATTOM_APIKEY=${{ secrets.ATTOM_APIKEY }}
                cd src
                chmod +x package_lambdas.sh
                ./package_lambdas.sh
                cd ..
                npm i -g serverless 
                
                ls src
                ls src/dist
                sls login 
                npm install serverless-appsync-plugin ---debug
                sls package --stage $STAGE --region $AWS_REGION
                sls deploy --stage $STAGE --region $AWS_REGION