name: Deploy drivestate-estatengine-backend

on:
    push:
        branches:
            - main
            - bedrock-integration
jobs:
    deploy:
        name: Deploy Backend
        runs-on: ubuntu-latest

        env:
            AWS_REGION: us-east-1
            STAGE: dev
            SERVERLESS_ACCESS_KEY: ${{secrets.SERVERLESS_ACCESS_KEY}}
        
        steps:
            - name: Checkout repo
              uses: actions/checkout@v3

            - name: Set up Python
              uses: actions/setup-python@v3
              with:
                python-version: "3.13"
            - name: Set up NodeJs
              uses: actions/setup-node@v4
            
            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                go-version: '1.22'  # or your preferred Go version
             
            - name: Serverless Deploy
              run: |
                
                # export STAGE=dev
                
                # Exporting 3P services
                export GPSE_API_KEY=${{ secrets.GPSE_API_KEY }}
                export GOOGLE_API_ID=${{ secrets.GOOGLE_API_ID }}
                export ATTOM_APIKEY=${{ secrets.ATTOM_APIKEY }}

                # Exporting ACCESS AWS credentials
                export AWS_ACCESS_KEY_ID=${{ secrets.ACCESS_AWS_ACCESS_KEY_ID }}
                export AWS_SECRET_ACCESS_KEY=${{ secrets.ACCESS_AWS_SECRET_ACCESS_KEY }}
                export AWS_REGION=${{ env.AWS_REGION }}

                export COGNITO_USER_POOL_ID=$(aws ssm get-parameter --name /dvst/auth/userpool/$STAGE --query Parameter.Value --output text)
                export COGNITO_USER_POOL_CLIENT_ID=$(aws ssm get-parameter --name /dvst/auth/userpool/client/$STAGE --query Parameter.Value --output text)
                

                # Exporting KNOWLEDGE AWS credentials
                export AWS_ACCESS_KEY_ID=${{ secrets.AWS_KNOWLEDGE_ACCESS_KEY_ID }}
                export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_KNOWLEDGE_SECRET_ACCESS_KEY }}
                export AWS_REGION=${{ env.AWS_REGION }}

                export AGENT_ID=$(aws ssm get-parameter --name /dvst-ai-agent/dev/agent-id --query Parameter.Value --output text)
                export AGENT_ALIAS_ID=$(aws ssm get-parameter --name /dvst-ai-agent/$STAGE/agent-alias --query Parameter.Value --output text)
                
                #Export Estatengine AWS credentials
                export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
                export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
                export AWS_REGION=${{ env.AWS_REGION }}
                
                cd src
                
                #Building go lambdas
                cd bedrock_handler
                make build
                zip bedrock_handler.zip bootstrap
                cd ..

                # Building Python Lambdas
                chmod +x package_lambdas.sh
                ./package_lambdas.sh
                cd ..

                npm i -g serverless 
                
                
                sls login 
                npm install serverless-appsync-plugin ---debug
                sls package --stage $STAGE --region $AWS_REGION
                sls deploy --stage $STAGE --region $AWS_REGION